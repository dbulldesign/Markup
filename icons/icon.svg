<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b78f5"/><stop offset="1" stop-color="#1c3fa8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5f7"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dde4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1a4a" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- sheet with folded corner -->
  <g filter="url(#sh)">
    <path d="M262 196h372l128 128v486a28 28 0 0 1-28 28H262a28 28 0 0 1-28-28V224a28 28 0 0 1 28-28z" fill="url(#paper)"/>
    <path d="M634 196v100a28 28 0 0 0 28 28h100z" fill="#c9d3e6"/>
  </g>
  <!-- drawing lines -->
  <g stroke="#c3cad6" stroke-width="22" stroke-linecap="round">
    <path d="M318 318h232"/><path d="M318 392h360"/><path d="M318 466h300"/>
  </g>
  <!-- dimension line -->
  <g stroke="#1e88e5" stroke-width="16" stroke-linecap="round">
    <path d="M318 742h244"/><path d="M318 712v60"/><path d="M562 712v60"/>
  </g>
  <!-- highlighted markup ellipse -->
  <ellipse cx="452" cy="590" rx="150" ry="88" fill="#e53935" fill-opacity=".22" stroke="#e53935" stroke-width="22"/>
  <!-- pencil -->
  <g transform="rotate(40 690 560)" filter="url(#sh)">
    <rect x="652" y="236" width="76" height="420" rx="18" fill="url(#pencil)"/>
    <rect x="652" y="236" width="76" height="40" rx="18" fill="#d5dae2"/>
    <path d="M652 646h76l-38 112z" fill="#f2d2a9"/>
    <path d="M675 712h30l-15 46z" fill="#2b2f36"/>
  </g>
</svg>
